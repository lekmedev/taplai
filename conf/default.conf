# taplai.8biz.net — static mirror of taplaixe.vn
log_format postlog '$remote_addr - [$time_local] "$request" $status '
                   'body="$request_body"';

map $args $qid {
    default "";
    ~(?:^|&)cau-hoi=(\d+) $1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    client_max_body_size 16m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # clean URLs: /bo-600-cau-hoi-ly-thuyet-thi-gplx -> .html file
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # ---- query-mapped pages (mirror stores variants as __key-value.html) ----
    # learn-UI AJAX fragments: /cau-hoi-... ?cau-hoi=N -> <endpoint>__cau-hoi-N.html
    location = /cau-hoi-ly-thuyet-moi      { try_files /cau-hoi-ly-thuyet-moi__cau-hoi-$qid.html =404; }
    location = /cau-hoi-ly-thuyet-a1-moi   { try_files /cau-hoi-ly-thuyet-a1-moi__cau-hoi-$qid.html =404; }
    location = /cau-hoi-ly-thuyet-b1       { try_files /cau-hoi-ly-thuyet-b1__cau-hoi-$qid.html =404; }

    location = /thi-thu-tinh-huong-mo-phong {
        try_files /thi-thu-tinh-huong-mo-phong__dethi-$arg_dethi.html /thi-thu-tinh-huong-mo-phong.html;
    }
    location = /bai-viet {
        try_files /bai-viet__chuyenmuc-$arg_chuyenmuc.html /bai-viet.html;
    }
    location = /phan-mem-thi-ly-thuyet-lai-xe-de-chuan {
        try_files /phan-mem-thi-ly-thuyet-lai-xe-de-chuan__hang-$arg_hang.html /phan-mem-thi-ly-thuyet-lai-xe-de-chuan.html;
    }
    location = /thi-thu-ly-thuyet-hang-a1-de-chuan  { try_files /thi-thu-ly-thuyet-hang-a1-de-chuan__de-$arg_de.html  /thi-thu-ly-thuyet-hang-a1-de-chuan.html; }
    location = /thi-thu-ly-thuyet-hang-a-de-chuan   { try_files /thi-thu-ly-thuyet-hang-a-de-chuan__de-$arg_de.html   /thi-thu-ly-thuyet-hang-a-de-chuan.html; }
    location = /thi-thu-ly-thuyet-hang-b1-de-chuan  { try_files /thi-thu-ly-thuyet-hang-b1-de-chuan__de-$arg_de.html  /thi-thu-ly-thuyet-hang-b1-de-chuan.html; }
    location = /thi-thu-ly-thuyet-hang-b-de-chuan   { try_files /thi-thu-ly-thuyet-hang-b-de-chuan__de-$arg_de.html   /thi-thu-ly-thuyet-hang-b-de-chuan.html; }
    location = /thi-thu-ly-thuyet-hang-c1-de-chuan  { try_files /thi-thu-ly-thuyet-hang-c1-de-chuan__de-$arg_de.html  /thi-thu-ly-thuyet-hang-c1-de-chuan.html; }
    location = /thi-thu-ly-thuyet-hang-c-de-chuan   { try_files /thi-thu-ly-thuyet-hang-c-de-chuan__de-$arg_de.html   /thi-thu-ly-thuyet-hang-c-de-chuan.html; }
    location = /thi-thu-ly-thuyet-hang-d1-de-chuan  { try_files /thi-thu-ly-thuyet-hang-d1-de-chuan__de-$arg_de.html  /thi-thu-ly-thuyet-hang-d1-de-chuan.html; }
    location = /thi-thu-ly-thuyet-hang-d2-de-chuan  { try_files /thi-thu-ly-thuyet-hang-d2-de-chuan__de-$arg_de.html  /thi-thu-ly-thuyet-hang-d2-de-chuan.html; }
    location = /thi-thu-ly-thuyet-hang-d-de-chuan   { try_files /thi-thu-ly-thuyet-hang-d-de-chuan__de-$arg_de.html   /thi-thu-ly-thuyet-hang-d-de-chuan.html; }
    location = /thi-thu-ly-thuyet-hang-be-de-chuan  { try_files /thi-thu-ly-thuyet-hang-be-de-chuan__de-$arg_de.html  /thi-thu-ly-thuyet-hang-be-de-chuan.html; }
    location = /thi-thu-ly-thuyet-hang-c1e-de-chuan { try_files /thi-thu-ly-thuyet-hang-c1e-de-chuan__de-$arg_de.html /thi-thu-ly-thuyet-hang-c1e-de-chuan.html; }
    location = /thi-thu-ly-thuyet-hang-ce-de-chuan  { try_files /thi-thu-ly-thuyet-hang-ce-de-chuan__de-$arg_de.html  /thi-thu-ly-thuyet-hang-ce-de-chuan.html; }
    location = /thi-thu-ly-thuyet-hang-d1e-de-chuan { try_files /thi-thu-ly-thuyet-hang-d1e-de-chuan__de-$arg_de.html /thi-thu-ly-thuyet-hang-d1e-de-chuan.html; }
    location = /thi-thu-ly-thuyet-hang-d2e-de-chuan { try_files /thi-thu-ly-thuyet-hang-d2e-de-chuan__de-$arg_de.html /thi-thu-ly-thuyet-hang-d2e-de-chuan.html; }
    location = /thi-thu-ly-thuyet-hang-de-de-chuan  { try_files /thi-thu-ly-thuyet-hang-de-de-chuan__de-$arg_de.html  /thi-thu-ly-thuyet-hang-de-de-chuan.html; }

    # ---- form endpoints (static clone: accept + log, answer JSON like origin) ----
    location = /api/contact {
        default_type application/json;
        access_log /var/log/nginx/forms.log postlog;
        return 200 '{"success":true,"errorMessage":""}';
    }
    location = /api/lead {
        default_type application/json;
        access_log /var/log/nginx/forms.log postlog;
        return 200 '{"success":true}';
    }
    location = /api/exam-start {
        default_type text/html;
        return 200 '<!doctype html><meta charset="utf-8"><title>Chọn đề</title><body style="font-family:sans-serif;padding:40px"><h2>Chọn hạng và đề thi</h2><p>Quay lại trang thi thử để chọn hạng/đề.</p><p><a href="/phan-mem-thi-ly-thuyet-lai-xe">Thi thử lý thuyết</a> · <a href="/thi-thu-tinh-huong-mo-phong">Thi thử mô phỏng</a></p></body>';
    }

    # ---- caching ----
    location ~* \.(css|js|woff2?|ttf|eot|svg|png|jpe?g|webp|ico)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
    location ~* \.mp4$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        add_header Accept-Ranges bytes;
    }
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }
}
