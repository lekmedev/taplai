services:
  taplai:
    image: nginx:alpine
    container_name: taplai
    restart: unless-stopped
    ports:
      - "0.0.0.0:8090:80"
    volumes:
      - ./www/taplaixe.vn:/usr/share/nginx/html:ro
      - ./conf/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs:/var/log/nginx
    networks:
      - hermes-webui_default

networks:
  hermes-webui_default:
    external: true
